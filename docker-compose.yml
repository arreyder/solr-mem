services:
  solr:
    image: solr:9
    container_name: solr-mem
    ports:
      - "0.0.0.0:8983:8983"
    volumes:
      - ./solr/managed-schema.xml:/opt/solr/server/solr/configsets/memories/conf/managed-schema.xml
      - ./solr/solrconfig.xml:/opt/solr/server/solr/configsets/memories/conf/solrconfig.xml
      - ./solr/stopwords.txt:/opt/solr/server/solr/configsets/memories/conf/stopwords.txt
      - ./solr/synonyms.txt:/opt/solr/server/solr/configsets/memories/conf/synonyms.txt
      - ./solr/code-managed-schema.xml:/opt/solr/server/solr/configsets/code/conf/managed-schema.xml
      - ./solr/code-solrconfig.xml:/opt/solr/server/solr/configsets/code/conf/solrconfig.xml
      - ./solr/stopwords.txt:/opt/solr/server/solr/configsets/code/conf/stopwords.txt
      - ./solr/synonyms.txt:/opt/solr/server/solr/configsets/code/conf/synonyms.txt
      - solr_data:/var/solr
    environment:
      SOLR_JAVA_MEM: "-Xms1g -Xmx4g"
    # Cap a little above the 4g JVM heap so Docker enforces a bound that leaves
    # headroom for off-heap/metaspace/thread stacks. The host (Colima) VM must
    # have more RAM than this (>=6g) for the limit to be backed by real memory.
    mem_limit: 5g
    command: >-
      bash -c "precreate-core memories /opt/solr/server/solr/configsets/memories;
      precreate-core code /opt/solr/server/solr/configsets/code;
      exec solr-foreground"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8983/solr/memories/admin/ping | grep -q OK && curl -sf http://localhost:8983/solr/code/admin/ping | grep -q OK"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  mcp-server:
    build: .
    container_name: solr-mem-mcp
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      SOLR_URL: "http://solr:8983/solr/memories"
      SOLR_URL_CODE: "http://solr:8983/solr/code"
    depends_on:
      solr:
        condition: service_healthy
    command: ["--http", ":8080"]
    restart: unless-stopped
    profiles:
      - network

  indexer:
    build: .
    container_name: solr-mem-indexer
    entrypoint: ["solr-mem-indexer"]
    command: ["--scan-dir", "${SRC_DIR:-.}", "--watch"]
    volumes:
      - ${SRC_DIR:-.}:${SRC_DIR:-.}:ro
    environment:
      SOLR_URL_CODE: "http://solr:8983/solr/code"
    depends_on:
      solr:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - network

volumes:
  solr_data:
