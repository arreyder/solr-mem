services:
  solr:
    image: solr:9
    container_name: solr-mem
    ports:
      - "0.0.0.0:8983:8983"
    volumes:
      - ./solr/managed-schema.xml:/opt/solr/server/solr/configsets/memories/conf/managed-schema.xml
      - ./solr/solrconfig.xml:/opt/solr/server/solr/configsets/memories/conf/solrconfig.xml
      - ./solr/stopwords.txt:/opt/solr/server/solr/configsets/memories/conf/stopwords.txt
      - ./solr/synonyms.txt:/opt/solr/server/solr/configsets/memories/conf/synonyms.txt
      - solr_data:/var/solr
    environment:
      SOLR_JAVA_MEM: "-Xms1g -Xmx4g"
    command: ["solr-precreate", "memories", "/opt/solr/server/solr/configsets/memories"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8983/solr/memories/admin/ping | grep -q OK"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  mcp-server:
    build: .
    container_name: solr-mem-mcp
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      SOLR_URL: "http://solr:8983/solr/memories"
      SOLR_URL_CODE: "http://solr:8983/solr/code"
    depends_on:
      solr:
        condition: service_healthy
    command: ["--http", ":8080"]
    restart: unless-stopped
    profiles:
      - network

volumes:
  solr_data:
